[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "pgsplit-enterprise"
version = "2.2.0"
description = "Streaming PostgreSQL dump splitter with metadata, restore planning, and a local IDE-style UI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12.3",
  "rich>=13.7.1",
  "sqlparse>=0.5.0",
  "PyYAML>=6.0.1",
  "loguru>=0.7.2",
  "networkx>=3.3",
  "pytest>=8.2.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "python-multipart>=0.0.9",
  "psutil>=5.9.8",
]

[project.scripts]
pgsplit = "pgsplit.main:main"

[tool.setuptools.package-dir]
"" = "backend"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["pgsplit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
